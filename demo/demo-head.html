<title>Site Scanner — interactive demo</title>
<style>
/*
  Site Scanner — a field instrument, not a document.

  The palette is the product's own: a cool green-cast near-black rather than a
  neutral grey, one warm amber accent, and semantic colour (good/warn/bad) held
  separate from that accent so a red cell never reads as "highlighted".

  Two type roles: system-ui runs the interface, ui-monospace runs every number.
  Data in a proportional face is the single fastest way to make a table look
  untrustworthy.
*/
:root {
  --ground: #0e1113;
  --surface: #171c20;
  --raised: #1e242a;
  --sunken: #0b0e10;
  --line: rgba(255,255,255,.09);
  --line-2: rgba(255,255,255,.16);

  --ink: #e8ecef;
  --ink-2: #9aa4ab;
  --ink-3: #6b757c;

  --accent: #ddae5c;
  --accent-2: #c4923f;
  --accent-soft: rgba(221,174,92,.16);

  --good: #7fb3a3;
  --warn: #d2a35a;
  --bad: #c47b72;

  --land: #1b2226;
  --land-line: rgba(221,174,92,.22);
  --sea: #0b0f12;

  --r: 12px;
  --r-sm: 8px;
  --shadow: 0 10px 34px rgba(0,0,0,.5);

  --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, monospace;

  --panel: 430px;
  --timeline: 104px;
}

/* Light theme is derived, not inverted: the ground lifts to a warm paper, the
   accent darkens to hold contrast on it, and the land keeps its relationship
   to the sea rather than flipping. */
@media (prefers-color-scheme: light) {
  :root {
    --ground: #f2f0ec; --surface: #fbfaf8; --raised: #fff; --sunken: #e8e5e0;
    --line: rgba(20,26,30,.12); --line-2: rgba(20,26,30,.22);
    --ink: #191f23; --ink-2: #55606a; --ink-3: #808b94;
    --accent: #a2701c; --accent-2: #8a5e14; --accent-soft: rgba(162,112,28,.13);
    --good: #3f7a68; --warn: #96661b; --bad: #a44c42;
    --land: #e4e0d4; --land-line: rgba(162,112,28,.55); --sea: #d3d8da;
    --shadow: 0 10px 30px rgba(30,35,40,.14);
  }
}
:root[data-theme="dark"] {
  --ground: #0e1113; --surface: #171c20; --raised: #1e242a; --sunken: #0b0e10;
  --line: rgba(255,255,255,.09); --line-2: rgba(255,255,255,.16);
  --ink: #e8ecef; --ink-2: #9aa4ab; --ink-3: #6b757c;
  --accent: #ddae5c; --accent-2: #c4923f; --accent-soft: rgba(221,174,92,.16);
  --good: #7fb3a3; --warn: #d2a35a; --bad: #c47b72;
  --land: #1c2429; --land-line: rgba(221,174,92,.3); --sea: #0a0d10;
  --shadow: 0 10px 34px rgba(0,0,0,.5);
}
:root[data-theme="light"] {
  --ground: #f2f0ec; --surface: #fbfaf8; --raised: #fff; --sunken: #e8e5e0;
  --line: rgba(20,26,30,.12); --line-2: rgba(20,26,30,.22);
  --ink: #191f23; --ink-2: #55606a; --ink-3: #808b94;
  --accent: #a2701c; --accent-2: #8a5e14; --accent-soft: rgba(162,112,28,.13);
  --good: #3f7a68; --warn: #96661b; --bad: #a44c42;
  --land: #e4e0d4; --land-line: rgba(162,112,28,.55); --sea: #d3d8da;
  --shadow: 0 10px 30px rgba(30,35,40,.14);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: var(--ground); color: var(--ink);
  font: 14px/1.5 var(--ui); -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; background: none; border: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

#app { position: relative; height: 100vh; width: 100%; }

/* ---- map ---- */
#mapWrap { position: absolute; inset: 0 var(--panel) var(--timeline) 0; background: var(--sea); }
#map { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#map.drawing { cursor: crosshair; }

.scalebar {
  position: absolute; left: 16px; bottom: 12px; font: 10px/1 var(--mono);
  color: var(--ink-3); display: flex; align-items: center; gap: 6px;
}
.scalebar i { display: block; height: 6px; border: 1px solid var(--line-2); border-top: none; }

/* ---- top bar ---- */
.top {
  position: absolute; top: 0; left: 0; right: var(--panel); height: 54px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; pointer-events: none; z-index: 6; gap: 12px;
}
.top > * { pointer-events: auto; }
.brand { display: flex; align-items: baseline; gap: 9px; min-width: 0; }
.mark {
  width: 12px; height: 12px; border-radius: 3px; align-self: center; flex: none;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  box-shadow: 0 0 14px var(--accent-soft);
}
.brand h1 { font-size: 15px; font-weight: 600; letter-spacing: -.01em; margin: 0; white-space: nowrap; }
.brand span {
  font: 10px/1 var(--mono); color: var(--ink-3); text-transform: uppercase;
  letter-spacing: .08em; border: 1px solid var(--line); border-radius: 20px;
  padding: 4px 7px; white-space: nowrap;
}
.top-right { display: flex; align-items: center; gap: 7px; }
.pill {
  font: 10px/1 var(--mono); text-transform: uppercase; letter-spacing: .06em;
  padding: 5px 8px; border-radius: 20px; border: 1px solid var(--line-2);
  background: var(--surface); color: var(--ink-2); white-space: nowrap;
}
.pill.demo { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.pill.approx { color: var(--ink-2); }

/* ---- tool rail ---- */
.rail {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 5px; padding: 6px; z-index: 7;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  border: 1px solid var(--line); border-radius: 15px;
  box-shadow: var(--shadow); backdrop-filter: blur(14px);
}
.tool {
  width: 38px; height: 38px; display: grid; place-items: center; border-radius: 10px;
  color: var(--ink-2); border: 1px solid transparent;
  transition: background .12s, color .12s, transform .1s;
}
.tool:hover:not(:disabled) { background: color-mix(in srgb, var(--ink) 8%, transparent); color: var(--ink); }
.tool:active:not(:disabled) { transform: scale(.93); }
.tool[aria-pressed="true"] {
  background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 45%, transparent);
  color: var(--accent);
}
.tool:disabled { opacity: .3; cursor: not-allowed; }
.tool.sep { margin-top: 4px; border-top: 1px solid var(--line); border-radius: 10px; }
.tool.danger:hover { color: var(--bad); }

.hint {
  position: absolute; left: 66px; top: 50%; transform: translateY(-50%);
  font-size: 12px; color: var(--ink-2); background: color-mix(in srgb, var(--surface) 88%, transparent);
  border: 1px solid var(--line); border-radius: 20px; padding: 5px 11px;
  pointer-events: none; z-index: 7; white-space: nowrap; backdrop-filter: blur(8px);
}

/* ---- panel ---- */
.panel {
  position: absolute; top: 0; right: 0; bottom: 0; width: var(--panel);
  background: var(--surface); border-left: 1px solid var(--line);
  display: flex; flex-direction: column; z-index: 8;
}
.panel-head { padding: 13px 15px 0; border-bottom: 1px solid var(--line); }
.panel-title { display: flex; align-items: baseline; gap: 9px; margin-bottom: 10px; }
.panel-title b { font-size: 14px; font-weight: 600; }
.panel-title em { font: 11px/1 var(--mono); color: var(--ink-3); font-style: normal; }

.tabs { display: flex; gap: 1px; }
.tab {
  padding: 7px 12px; font-size: 12.5px; color: var(--ink-3);
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tab:hover { color: var(--ink-2); }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

.actions { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 0 9px; position: relative; }
.btn {
  padding: 4px 9px; border-radius: 6px; font-size: 11.5px;
  border: 1px solid var(--line-2); color: var(--ink-2);
  display: inline-flex; align-items: center; gap: 5px;
}
.btn:hover:not(:disabled) { color: var(--ink); border-color: var(--ink-3); }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn[aria-expanded="true"] { color: var(--accent); border-color: var(--accent-2); }
.btn b { font: 9.5px/1.6 var(--mono); padding: 0 4px; border-radius: 7px;
         background: var(--accent-soft); color: var(--accent); }

.menu {
  position: absolute; top: calc(100% - 2px); left: 0; z-index: 30; min-width: 240px;
  background: var(--raised); border: 1px solid var(--line-2); border-radius: var(--r-sm);
  box-shadow: var(--shadow); padding: 4px; display: flex; flex-direction: column;
  max-height: 300px; overflow-y: auto;
}
.menu button {
  text-align: left; padding: 7px 9px; border-radius: 5px; font-size: 12px; color: var(--ink-2);
}
.menu button:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); color: var(--ink); }
.menu .empty { padding: 14px; text-align: center; font-size: 11.5px; color: var(--ink-3); }
.menu .row { display: flex; align-items: center; }
.menu .row button:first-child { flex: 1; display: flex; justify-content: space-between; gap: 10px; }
.menu .row span { font: 10.5px/1 var(--mono); color: var(--ink-3); }
.menu .row .del { width: 26px; text-align: center; color: var(--ink-3); font-size: 15px; }
.menu .row .del:hover { color: var(--bad); }

.flash {
  position: absolute; top: calc(100% + 2px); right: 0; z-index: 40; max-width: 100%;
  padding: 6px 10px; border-radius: 6px; font-size: 11.5px; color: var(--good);
  background: var(--raised); border: 1px solid var(--line-2); box-shadow: var(--shadow);
}
.flash.err { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }

.body { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

.empty-state { padding: 44px 26px; text-align: center; color: var(--ink-2); }
.empty-state p { margin: 0 0 9px; font-size: 13px; }
.empty-state .sub { font-size: 12px; color: var(--ink-3); }
.empty-state .meta {
  margin-top: 22px; padding-top: 15px; border-top: 1px solid var(--line);
  font: 11px/1.6 var(--mono); color: var(--ink-3);
}

/* ---- table: Excel conventions, deliberately ---- */
.tbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 14px; border-bottom: 1px solid var(--line);
  font: 10.5px/1 var(--mono); color: var(--ink-3);
}
.tscroll { flex: 1; overflow: auto; }
table.grid { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12px; }
table.grid th {
  position: sticky; top: 0; z-index: 2; background: var(--raised);
  border-bottom: 1px solid var(--line-2); padding: 7px 9px; text-align: right;
  font-size: 10.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap;
  vertical-align: bottom; cursor: pointer; user-select: none;
}
table.grid th:hover { color: var(--ink); }
table.grid th u { display: block; font: 9px/1.4 var(--mono); color: var(--ink-3); text-decoration: none; }
table.grid td {
  padding: 5px 9px; border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent);
  text-align: right; font: 11.5px/1.5 var(--mono); font-variant-numeric: tabular-nums;
}
.yr {
  position: sticky; left: 0; z-index: 1; text-align: left !important;
  background: var(--surface); font-weight: 600; border-right: 1px solid var(--line);
  white-space: nowrap;
}
th.yr { z-index: 3; background: var(--raised); }
tr.year { cursor: pointer; }
tr.year:hover td { background: color-mix(in srgb, var(--ink) 4%, transparent); }
tr.year.now td { background: var(--accent-soft); }
tr.year.now .yr, tr.year.open .yr { color: var(--accent); }
tr.mo td { padding: 3px 9px; font-size: 11px; background: color-mix(in srgb, var(--sunken) 60%, transparent); color: var(--ink-2); }
tr.mo { cursor: pointer; }
tr.mo:hover td { background: color-mix(in srgb, var(--ink) 6%, transparent); }
tr.mo.now td { background: var(--accent-soft); color: var(--ink); }
td.molab { padding-left: 22px !important; color: var(--ink-3); font-weight: 400 !important; }
.caret { display: inline-block; width: 12px; font-size: 10px; line-height: 1; color: var(--accent-2); }

/* Confidence is encoded in form, not just number: a mean from three cloud-free
   pixels must not look as solid as one from thousands. */
.c-fair { color: var(--ink-2); }
.c-poor { color: var(--ink-3); font-style: italic; }
.gapv { color: var(--ink-3); opacity: .5; }
.part { color: var(--warn); opacity: .75; margin-left: 2px; }

/* ---- cards, charts ---- */
.stack { flex: 1; overflow-y: auto; padding: 11px; display: flex; flex-direction: column; gap: 11px; }
.card { background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 11px 12px 9px; }
.card h3 { margin: 0; font-size: 12.5px; font-weight: 600; }
.card .why { font-size: 10.5px; color: var(--ink-3); margin-top: 2px; }
.card svg { display: block; width: 100%; height: auto; margin-top: 8px; overflow: visible; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 11px; margin-top: 7px; font: 10px/1 var(--mono); color: var(--ink-2); }
.legend i { display: inline-block; width: 9px; height: 3px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }

.card.cmp { border-color: color-mix(in srgb, var(--good) 32%, transparent); }
.cmp-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
table.cmp { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 11.5px; }
table.cmp th {
  text-align: right; font: 9.5px/1.4 var(--mono); color: var(--ink-3);
  padding: 3px 5px; border-bottom: 1px solid var(--line); text-transform: uppercase; letter-spacing: .04em;
}
table.cmp th:first-child, table.cmp td:first-child { text-align: left; }
table.cmp td {
  padding: 4px 5px; text-align: right; font: 11px/1.5 var(--mono);
  font-variant-numeric: tabular-nums; border-bottom: 1px solid color-mix(in srgb, var(--line) 50%, transparent);
}
table.cmp td:first-child { font-family: var(--ui); color: var(--ink-2); }
.up { color: var(--good); } .down { color: var(--bad); }
.flat, .same { color: var(--ink-3); } .chg { color: var(--warn); }
.pct { opacity: .65; font-size: 10px; }
.note { margin-top: 9px; font-size: 10.5px; color: var(--ink-3); line-height: 1.45; }

/* ---- sources ---- */
.src { background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px; }
.src h3 { margin: 0 0 8px; font-size: 12.5px; }
.src dl { display: grid; grid-template-columns: 104px 1fr; gap: 3px 10px; margin: 0 0 9px; font-size: 11.5px; }
.src dt { color: var(--ink-3); } .src dd { margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip {
  font: 10px/1.5 var(--mono); padding: 2px 7px; border-radius: 20px;
  background: color-mix(in srgb, var(--ink) 5%, transparent);
  border: 1px solid var(--line); color: var(--ink-2);
}
.chip em { color: var(--accent-2); font-style: normal; }
.src a { display: inline-block; margin-top: 9px; font: 10.5px/1 var(--mono); color: var(--ink-3); text-decoration: none; }
.src a:hover { color: var(--accent); }

/* ---- timeline ---- */
.timeline {
  position: absolute; left: 0; right: var(--panel); bottom: 0; height: var(--timeline);
  display: flex; align-items: center; gap: 14px; padding: 10px 20px 14px;
  background: var(--surface); border-top: 1px solid var(--line); z-index: 7;
}
.play {
  width: 38px; height: 38px; flex: none; display: grid; place-items: center;
  border-radius: 50%; border: 1px solid var(--line-2); color: var(--accent);
  background: color-mix(in srgb, var(--ink) 5%, transparent); transition: transform .1s, background .12s;
}
.play:hover { background: var(--accent-soft); }
.play:active { transform: scale(.92); }

.readout { width: 152px; flex: none; min-width: 0; }
.readout .step { font: 600 14px/1.3 var(--mono); letter-spacing: -.01em; }
.readout .val { font: 12px/1.4 var(--mono); color: var(--accent); display: flex; align-items: center; gap: 5px; }
.readout .val.gap { color: var(--bad); font-style: italic; }
.readout .lo { font: 9px/1.5 var(--mono); padding: 0 4px; border-radius: 3px; background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); font-style: normal; }
.readout .who { font-size: 10.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.readout .vs {
  font: 10.5px/1.5 var(--mono); color: var(--good); padding: 1px 7px; border-radius: 20px;
  background: color-mix(in srgb, var(--good) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--good) 32%, transparent);
}

.track { flex: 1; position: relative; height: 58px; min-width: 0; }
#spark { position: absolute; inset: 0 0 15px; width: 100%; height: 43px; }
#range {
  position: absolute; inset: 0 0 15px; width: 100%; height: 43px; margin: 0;
  -webkit-appearance: none; appearance: none; background: none; cursor: ew-resize;
}
#range::-webkit-slider-runnable-track { height: 43px; background: none; }
#range::-moz-range-track { height: 43px; background: none; }
#range::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 3px; height: 43px; border: none;
  border-radius: 2px; background: var(--accent); box-shadow: 0 0 10px var(--accent);
}
#range::-moz-range-thumb {
  width: 3px; height: 43px; border: none; border-radius: 2px;
  background: var(--accent); box-shadow: 0 0 10px var(--accent);
}
.years { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; }
.years span {
  position: absolute; transform: translateX(-50%);
  font: 9.5px/1 var(--mono); color: var(--ink-3);
}

/* ---- overlays ---- */
.scrim {
  position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 22px;
  background: color-mix(in srgb, var(--ground) 72%, transparent); backdrop-filter: blur(4px);
}
.sheet {
  width: min(720px, 100%); max-height: 84vh; overflow-y: auto; padding: 18px 20px 22px;
  background: var(--surface); border: 1px solid var(--line-2);
  border-radius: var(--r); box-shadow: var(--shadow);
}
.sheet-head { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
.sheet-head h2 { margin: 0; font-size: 16px; font-weight: 600; }
.sheet-head p { margin: 3px 0 0; font-size: 12px; color: var(--ink-3); }
.x { width: 30px; height: 30px; border-radius: 7px; color: var(--ink-3); font-size: 19px; line-height: 1; flex: none; }
.x:hover { color: var(--ink); background: color-mix(in srgb, var(--ink) 7%, transparent); }

.tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(216px, 1fr)); gap: 10px; }
.tpl {
  text-align: left; padding: 13px; border-radius: var(--r-sm);
  border: 1px solid var(--line); background: var(--raised);
  transition: border-color .12s, transform .12s;
}
.tpl:hover { border-color: var(--accent-2); transform: translateY(-1px); }
.tpl b { display: block; font-size: 13px; margin-bottom: 3px; }
.tpl p { margin: 0 0 9px; font-size: 11.5px; color: var(--ink-2); line-height: 1.45; }

/* factor browser */
.browser {
  position: absolute; top: 54px; right: calc(var(--panel) + 14px); width: 336px;
  max-height: calc(100vh - var(--timeline) - 80px); z-index: 20;
  display: flex; flex-direction: column; overflow: hidden;
  background: color-mix(in srgb, var(--surface) 96%, transparent);
  border: 1px solid var(--line-2); border-radius: var(--r);
  box-shadow: var(--shadow); backdrop-filter: blur(18px);
}
.browser header { display: flex; gap: 6px; padding: 10px; border-bottom: 1px solid var(--line); }
.browser input {
  flex: 1; padding: 7px 10px; border-radius: var(--r-sm); font: inherit; font-size: 13px;
  border: 1px solid var(--line-2); background: var(--sunken); color: var(--ink); outline: none;
}
.browser input:focus { border-color: var(--accent-2); }
.browser .meta { padding: 7px 12px; font: 10.5px/1.5 var(--mono); color: var(--ink-3); border-bottom: 1px solid var(--line); }
.browser .list { overflow-y: auto; padding: 4px 0 10px; }
.grp {
  width: 100%; display: flex; align-items: center; gap: 6px; padding: 7px 12px;
  font: 600 10px/1 var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3);
}
.grp:hover { color: var(--ink-2); }
.grp em { margin-left: auto; font-style: normal; font-weight: 400; letter-spacing: 0; }
.fac {
  width: 100%; display: flex; align-items: center; gap: 8px;
  padding: 6px 12px 6px 14px; text-align: left; font-size: 12.5px; color: var(--ink-2);
}
.fac:hover:not(:disabled) { background: color-mix(in srgb, var(--ink) 6%, transparent); color: var(--ink); }
.fac[aria-pressed="true"] { color: var(--ink); }
.fac:disabled { opacity: .32; cursor: not-allowed; }
.fac i {
  width: 14px; height: 14px; border-radius: 4px; flex: none; display: grid; place-items: center;
  border: 1px solid var(--line-2); font-style: normal; font-size: 9px; color: var(--ground);
