<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS does not accept an SVG icon and does not synthesise one: without
         this it puts a screenshot of the page on the home screen. Rendered
         from favicon.svg onto the bone ground, because a transparent PNG
         composites to a black square there. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#16352a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- These are the defaults, and they are what a crawler that does not run
         JavaScript will see. Once React mounts, `src/site/SEO.tsx` replaces
         the title, description and social tags with the ones for the matched
         route, from the single table in `src/site/site.ts`.

         So this block is deliberately the homepage's metadata rather than
         something generic: an unrendered fetch of any URL should describe the
         product accurately, not say "web" or "Loading…". -->
    <title>Site Scanner | Environmental site evidence</title>
    <meta name="description" content="Site Scanner establishes evidence about a site from satellite and open data, states what that evidence does not settle, and names what a professional should investigate next." />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Site Scanner" />
    <meta property="og:title" content="Site Scanner | Environmental site evidence" />
    <meta property="og:description" content="Specialist scanners for understanding land, ecology and environmental conditions. Evidence, its limits, and what to investigate next." />
    <!-- og:url and og:image deliberately absent: there is no canonical public
         URL for this deployment yet, and no branded social image exists.
         Pointing them at a placeholder would be worse than omitting them —
         a wrong og:url is cached by every platform that reads it. Set
         VITE_SITE_ORIGIN and og:url, canonical and the sitemap all appear
         together. See docs/WEBSITE_AUDIT.md. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Site Scanner | Environmental site evidence" />
    <meta name="twitter:description" content="Specialist scanners for understanding land, ecology and environmental conditions." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
