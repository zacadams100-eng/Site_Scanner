    <!--
      Saira carries every tracked-caps label in the interface; it is the nearest
      thing to the wordmark's wide geometric caps. It is served from our own
      origin (see public/fonts and the @font-face rules in index.css) rather
      than a font CDN — one fewer third party, no render-blocking request to a
      host we do not control, and the brand voice survives a restricted
      network. Preloaded because it is used above the fold, in the brand plate.
    -->
    <link
      rel="preload"
      href="/fonts/saira-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
