name: CI

# Two jobs.
#
# `tests` runs against fictional fixtures with no network, on every push.
#
# `live-sheet` makes one real sheet from the publishers, for the example red
# line in examples/. The tool was written in workspaces that could not reach
# Natural England, the Environment Agency or planning.data — GitHub's runners
# can. The PDF, GeoPackage and JSON record are uploaded as a build artifact,
# and every layer that came back NOT ASSESSED is listed as a warning, with
# its reason. It warns rather than fails: a publisher being down is not a bug
# in this commit, but it must never pass silently either.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Python tests
        run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Frontend tests, typecheck and build
        working-directory: web
        run: |
          npm ci
          npm test
          npx tsc --noEmit -p tsconfig.app.json
          npm run build

  live-sheet:
    name: Live sheet (real publishers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: What the publishers actually send
        # Field names and record counts, read off the live services.
        run: python scripts/inspect_layers.py

      - name: Make real sheets for the example red lines
        env:
          OS_API_KEY: ${{ secrets.OS_API_KEY }}
        run: |
          status=0
          for site in merrow:guildford crowthorne:crowthorne; do
            name=${site%%:*}; file=${site##*:}
            set +e
            python -m sheet make examples/$file.geojson \
              --title "Example: $name" --ref CI-$name --out live/$name
            code=$?
            set -e
            python - live/$name <<'PY'
          import glob, json, sys
          rec = json.load(open(glob.glob(sys.argv[1] + "/*.json")[0]))
          c = rec["counts"]
          print(f"\n{rec['title']} · {rec['area_ha']} ha · 1:{rec['scale']:,}")
          print(f"present {c['present']} · none found {c['none_found']} · not assessed {c['not_assessed']}")
          for f in rec["findings"]:
              print(f"  {f['status']:<13} {f['name']}: {f['summary']}")
              if f.get("unlabelled_fields"):
                  print(f"::warning title=Unnamed: {f['name']}::fields sent: {f['unlabelled_fields']}")
              if f["status"] == "not_assessed":
                  print(f"::warning title=Not assessed: {f['name']}::{f['error']}")
          PY
            # 3 = some layer not assessed (warned above). Anything else non-zero is a crash.
            if [ "$code" != 0 ] && [ "$code" != 3 ]; then status=$code; fi
          done
          exit $status

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-sheet
          path: live/
          if-no-files-found: warn
