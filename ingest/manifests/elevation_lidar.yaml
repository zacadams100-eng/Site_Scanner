# One stored raster, thirteen factors. Slope, aspect, ruggedness, TPI,
# curvature and height-above-drainage are all computed from this at read time.
id: lidar_dtm
kind: continuous
unit: m
nodata: -9999

source:
  driver: http
  url: https://environment.data.gov.uk/lidar/composite-dtm-2m

temporal:
  step: static

spatial:
  resolution_m: 2
  crs: EPSG:27700
  bbox: [-6.42, 49.86, 1.77, 55.81]

h3_resolutions: [7, 8]

# Elevation in metres, England's range roughly [-4, 978]. 5 cm resolution is
# finer than the 15 cm vertical accuracy of the source LiDAR, and int16 at that
# scale reaches +/-1,638 m — comfortably past Scafell Pike.
storage:
  dtype: int16
  scale: 0.05
