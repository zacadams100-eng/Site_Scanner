# Sentinel-2 NDVI over Surrey — the county-scale ingest benchmark.
#
# Identical to ndvi_s2.yaml except for the bbox. Surrey is 1,663 km2, which is
# 1.3% of England, so what this measures multiplies by ~78 to give a national
# figure. See docs/INGEST-BENCHMARK.md for the run and its results.
#
# Why a separate manifest rather than a --bbox flag: the bbox is part of what
# a dataset *is*, and a run whose extent came from the command line cannot be
# reproduced from the repository.
id: ndvi_s2_surrey
kind: continuous
unit: index
nodata: -9999

source:
  driver: earthengine
  collection: COPERNICUS/S2_SR_HARMONIZED
  expression: "(B8 - B4) / (B8 + B4)"
  cloud_mask:
    band: SCL
    exclude: [8, 9, 10]        # cloud medium/high probability, cirrus
  composite: median

temporal:
  step: monthly
  start: "2024-01"
  end: "2024-12"

spatial:
  resolution_m: 10
  crs: EPSG:27700
  # Surrey's administrative extent, rounded outwards to whole hundredths.
  # West of Farnham to east of Oxted; Staines in the north to Haslemere.
  bbox: [-0.85, 51.07, 0.06, 51.47]

h3_resolutions: [7, 8]

storage:
  dtype: int16
  scale: 0.0001
